# Study meta-data
gwas_id: GCST007435
author_notes: "1. Citation: \n\tAmbalavanan A, Chang L, Choi J, Zhang Y, Stickley
  SA, Fang ZY, Miliku K, Robertson B, Yonemitsu C, Turvey SE, Mandhane PJ, Simons
  E, Moraes TJ, Anand SS, Paré G, Williams JE, Murdoch BM, Otoo GE, Mbugua S, Kamau-Mbuthia
  EW, Kamundia EW, Gindola DK, Rodriguez JM, Pareja RG, Sellen DW, Moore SE, Prentice
  AM, Foster JA, Kvist LJ, Neibergs HL, McGuire MA, McGuire MK, Meehan CL, Sears MR,
  Subbarao P, Azad MB, Bode L, Duan QL (2024) Human milk oligosaccharides are associated
  with maternal genetics and respiratory health of human milk-fed children. Nature
  Communications.\n\n2. Additional columns: \n\ttest: Association test type used in
  PLINK, ADD denoting an additive test\n\tT-statistic: Value of the coefficient t-statistic
  (PLINK linear and logistic models)\n\n3. QC measures:\n\tSubject-level QC: For the
  sex check, we selected variants with minor allele frequencies above 0.01 and pruned
  variants by linkage disequilibrium (LD; r2 > 0.5), excluding the pseudo-autosomal
  regions of the sex chromosomes. A total of 57 subjects were removed for exceeding
  an X chromosome inbreeding coefficient of 0.2 for females and 0.8 for males. We
  validated these results using Y chromosome counts for each subject. A total of 5,450
  subjects remained after the sex check. Among the mothers, 73 had excess heterozygosity
  based on the observed number of non-homozygous variants (+/-2 standard deviation)
  and genotype missingness > 7%. Among the children, 39 subjects had excess heterozygosity
  (+/-2 standard deviation) and genotype missingness >10%. These were removed from
  further analysis.Subjects with third-degree relatives were identified using pairwise
  Identify-By-Descent (IBD) analysis and one of each pair with inbreeding coefficients
  > 0.185 were removed as recommended by previous studies2. We identified 40 related
  subjects among the mothers and 37 related subjects among the children. \n\tSNP level
  QC: We selected autosomal variants and removed all variants that exceeded a missingness
  of 0.05 or greater. Hardy-Weinberg equilibrium filtering was not applied to this
  dataset as the CHILD Study included mixed ancestries . However, we performed a Hardy-Weinberg
  equilibrium test for subjects who reported as Central European ancestry only, excluding
  variants that deviated from the P<10e-07 threshold. A total of 515,033 variants
  and 5,261 subjects (mothers and children) passed QC filters."
